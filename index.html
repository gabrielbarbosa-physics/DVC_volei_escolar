async function carregarPresencasEventoDVC(eventId, force = false) {
  if (!eventId) return [];

  window.DVC_CACHE = window.DVC_CACHE || {};
  window.DVC_CACHE.presencasPorEvento = window.DVC_CACHE.presencasPorEvento || {};

  const cache = window.DVC_CACHE.presencasPorEvento[eventId];

  if (!force && cache && Array.isArray(cache.dados) && Date.now() - cache.atualizadoEm < 2 * 60 * 1000) {
    return cache.dados;
  }

  console.log("[DVC leitura] presencas", eventId);

  const snap = await getDocs(collection(db, "events", eventId, "presencas"));

  const presencas = snap.docs.map(docSnap => ({
    id: docSnap.id,
    email: docSnap.id,
    ...docSnap.data()
  }));

  window.DVC_CACHE.presencasPorEvento[eventId] = {
    dados: presencas,
    atualizadoEm: Date.now()
  };

  return presencas;
}
window.carregarPresencasEventoDVC = carregarPresencasEventoDVC;

        function limparCacheDVC(chave = null) {
            if (chave) {
                window.invalidarCacheDVC(chave);
                return;
            }
            window.AppCache = {};
        }
        window.limparCacheDVC = limparCacheDVC;

        async function carregarUsuariosCacheDVC(force = false) {
            if (!force && window.cacheValidoDVC("users")) {
                return window.obterCacheDVC("users").dados;
            }
            
            const snap = await window.getDocsDVC(collection(db, "users"), { force: true });
            const usuarios = snap.docs.map(docSnap => ({
                id: docSnap.id,
                email: docSnap.id,
                ...docSnap.data()
            }));
            const porEmail = new Map();
            usuarios.forEach(user => {
                const emailPrincipal = normalizarEmailDVC(user.email || user.id);
                if (emailPrincipal) porEmail.set(emailPrincipal, user);
                const idDoc = normalizarEmailDVC(user.id);
                if (idDoc) porEmail.set(idDoc, user);
            });
            
            window.salvarCacheDVC("users", { dados: usuarios, porEmail });
            return usuarios;
        }

        async function obterUsuarioCacheDVC(email, force = false) {
            const emailNorm = normalizarEmailDVC(email);
            if (!emailNorm) return null;
            await carregarUsuariosCacheDVC(force);
            const cache = window.obterCacheDVC("users");
            return cache?.porEmail?.get(emailNorm) || null;
        }
        window.obterUsuarioCacheDVC = obterUsuarioCacheDVC;

        async function carregarEventosCacheDVC(force = false) {
            if (!force && window.cacheValidoDVC("events")) {
                return window.obterCacheDVC("events").dados;
            }
            
            const snap = await window.getDocsDVC(collection(db, "events"), { force: true });
            const eventos = snap.docs.map(docSnap => ({
                id: docSnap.id,
                ...docSnap.data()
            }));
            const porId = new Map();
            eventos.forEach(evento => {
                if (evento.id) porId.set(evento.id, evento);
            });
            
            window.salvarCacheDVC("events", { dados: eventos, porId });
            return eventos;
        }
        window.carregarEventosCacheDVC = carregarEventosCacheDVC;

        async function obterEventoCacheDVC(eventId, force = false) {
            if (!eventId) return null;
            await carregarEventosCacheDVC(force);
            const cache = window.obterCacheDVC("events");
            return cache?.porId?.get(eventId) || null;
        }

        function criarMockSnapshotDVC(array) {
            return {
                docs: array.map(item => ({
                    id: item.id,
                    data: () => item,
                    exists: () => true
                })),
                empty: array.length === 0,
                size: array.length,
                forEach: function(cb) {
                    this.docs.forEach(cb);
                }
            };
        }

        async function carregarUsuariosCacheMockDVC(force = false) {
            const arr = await carregarUsuariosCacheDVC(force);
            return criarMockSnapshotDVC(arr);
        }
        window.carregarUsuariosCacheMockDVC = carregarUsuariosCacheMockDVC;

        async function carregarEventosCacheMockDVC(force = false) {
            const arr = await carregarEventosCacheDVC(force);
            return criarMockSnapshotDVC(arr);
        }
        window.carregarEventosCacheMockDVC = carregarEventosCacheMockDVC;



        function snapshotToArray(snapshot) {
            if (Array.isArray(snapshot)) return snapshot;
            return snapshot.docs.map(d => ({
                id: d.id,
                ...d.data()
            }));
        }

            if (

        window.gerarBarrinhasHabilidades = (habilidades) => {
    const listaHabilidades = [
        { id: 'manchete', nome: 'Manchete' },
        { id: 'toque', nome: 'Toque' },
        { id: 'ataque', nome: 'Ataque' },
        { id: 'saque', nome: 'Saque' },
        { id: 'visaoJogo', nome: 'Visão de Jogo' },
        { id: 'defesa', nome: 'Defesa' },
        { id: 'comunicacao', nome: 'Comunicação' },
        { id: 'trabalhoEquipe', nome: 'Trabalho em Equipe' }
    ];

    const h = habilidades || {};

    const valores = listaHabilidades.map(item => {
        const valor = Number(h[item.id] || 0);
        return isNaN(valor) ? 0 : Math.max(0, Math.min(5, valor));
    });

    const temAvaliacao = valores.some(v => v > 0);

    if (!temAvaliacao) {
        return `
            <div class="bg-gray-50 border border-dashed rounded-xl p-4 text-center">
                <p class="text-[10px] text-gray-400 font-bold uppercase">
                    Ainda sem avaliação técnica registrada.
                </p>
            </div>
        `;
    }

    const centroX = 150;
    const centroY = 150;
    const raioMax = 95;

    const calcularPonto = (index, valor, raioBase = raioMax) => {
        const angulo = ((Math.PI * 2) / listaHabilidades.length) * index - Math.PI / 2;
        const raio = raioBase * (valor / 5);

        return {
            x: centroX + Math.cos(angulo) * raio,
            y: centroY + Math.sin(angulo) * raio
        };
    };

    const calcularPontoGrade = (index, nivel) => {
        const angulo = ((Math.PI * 2) / listaHabilidades.length) * index - Math.PI / 2;
        const raio = raioMax * (nivel / 5);

        return {
            x: centroX + Math.cos(angulo) * raio,
            y: centroY + Math.sin(angulo) * raio
        };
    };

    const calcularPontoLabel = (index) => {
        const angulo = ((Math.PI * 2) / listaHabilidades.length) * index - Math.PI / 2;
        const raio = raioMax + 28;

        return {
            x: centroX + Math.cos(angulo) * raio,
            y: centroY + Math.sin(angulo) * raio
        };
    };

    const pontosRadar = valores
        .map((valor, index) => {
            const p = calcularPonto(index, valor);
            return `${p.x},${p.y}`;
        })
        .join(' ');

    const grades = [1, 2, 3, 4, 5].map(nivel => {
        const pontosGrade = listaHabilidades
            .map((_, index) => {
                const p = calcularPontoGrade(index, nivel);
                return `${p.x},${p.y}`;
            })
            .join(' ');

        return `
            <polygon 
                points="${pontosGrade}" 
                fill="none" 
                stroke="#e5e7eb" 
                stroke-width="1">
            </polygon>
        `;
    }).join('');

    const linhasEixos = listaHabilidades.map((_, index) => {
        const p = calcularPontoGrade(index, 5);

        return `
            <line 
                x1="${centroX}" 
                y1="${centroY}" 
                x2="${p.x}" 
                y2="${p.y}" 
                stroke="#e5e7eb" 
                stroke-width="1">
            </line>
        `;
    }).join('');

    const labels = listaHabilidades.map((item, index) => {
        const p = calcularPontoLabel(index);
        const valor = valores[index];

        return `
            <text 
                x="${p.x}" 
                y="${p.y}" 
                text-anchor="middle" 
                dominant-baseline="middle" 
                font-size="8" 
                font-weight="700" 
                fill="#4b5563">
                ${item.nome}
            </text>

            <text 
                x="${p.x}" 
                y="${p.y + 10}" 
                text-anchor="middle" 
                dominant-baseline="middle" 
                font-size="8" 
                font-weight="900" 
                fill="#990000">
                ${valor}
            </text>
        `;
    }).join('');

    const pontosVertices = valores.map((valor, index) => {
        const p = calcularPonto(index, valor);

        return `
            <circle 
                cx="${p.x}" 
                cy="${p.y}" 
                r="3" 
                fill="#990000">
            </circle>
        `;
    }).join('');

    const media = valores.length > 0 
        ? (valores.reduce((a, b) => a + b, 0) / valores.length).toFixed(1) 
        : "0.0";

    const listaNotas = listaHabilidades.map((item, index) => `
        <div class="flex justify-between items-center bg-gray-50 rounded-lg px-3 py-2 border">
            <span class="text-[9px] font-bold text-gray-600 uppercase">
                ${item.nome}
            </span>
            <span class="text-[10px] font-black text-[#990000]">
                ${valores[index]}/5
            </span>
        </div>
    `).join('');

    return `
        <div class="bg-white rounded-xl">
            <div class="bg-gray-50 border rounded-xl p-3 mb-3 text-center">
                <p class="text-[9px] font-black text-gray-400 uppercase">
                    Score Técnico
                </p>
                <p class="text-3xl font-black text-[#990000] leading-tight">
                    ${media}
                </p>
                <p class="text-[8px] font-bold text-gray-400 uppercase">
                    Média geral das habilidades
                </p>
            </div>

            <div class="flex justify-center overflow-hidden">
                <svg viewBox="0 0 300 300" class="w-full max-w-[300px] h-[300px]">
                    ${grades}
                    ${linhasEixos}

                    <polygon 
                        points="${pontosRadar}" 
                        fill="rgba(153, 0, 0, 0.18)" 
                        stroke="#990000" 
                        stroke-width="2">
                    </polygon>

                    ${pontosVertices}
                    ${labels}
                </svg>
            </div>

            <div class="grid grid-cols-2 gap-2 mt-3">
                ${listaNotas}
            </div>
        </div>
    `;
};
async function calcularMediaCategoriaDVC(userDataPerfil, emailPerfil, usuariosExistentes = null) {
    try {
        const sexoPerfil = userDataPerfil?.sexo || null;

        if (!sexoPerfil) { return null; }

        const usuarios = usuariosExistentes || snapshotToArray(await carregarUsuariosCacheMockDVC());

        let soma = {};
        let total = 0;

        TODAS_HABILIDADES_DVC.forEach(skill => {
            soma[skill.id] = 0;
        });

        usuarios.forEach(user => {
            const email = user.email || user.id;

            if (email === emailPerfil) return;
            if (ehResponsavelTecnico(user)) return;
            if (user.status !== "Ativo") return;
            if (user.sexo !== sexoPerfil) return;

            const habilidades = normalizarHabilidadesDVC(user.habilidades || {});

            TODAS_HABILIDADES_DVC.forEach(skill => {
                soma[skill.id] += Number(habilidades[skill.id] || 3);
            });

            total++;
        });

        if (total === 0) {
            return null;
        }

        let media = {};

        TODAS_HABILIDADES_DVC.forEach(skill => {
            media[skill.id] = Number((soma[skill.id] / total).toFixed(1));
        });

        return {
            tipo: sexoPerfil === "F" ? "Média Feminina" : "Média Masculina",
            total,
            habilidades: media
        };

    } catch (e) {
        console.warn("Erro ao calcular média da categoria:", e);
        return null;
    }
}
